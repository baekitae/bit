# 모든 설정값은 여기서 관리합니다 (코드에 하드코딩 금지). DESIGN.md 4장·7장 참고.

market: KRW-BTC
timeframe_minutes: 240        # 4시간봉. 1시간봉은 60
db_path: data/bot.db          # 프로젝트 폴더 기준 상대 경로

data:
  history_years: 4            # 과거 데이터 수집 기간
  request_interval_sec: 0.12  # 업비트 API 호출 간격 (호출 제한 준수)
  max_candle_delay_bars: 1    # 실시간: 최신 마감 봉이 이보다 늦으면 데이터 이상

costs:
  fee_rate: 0.0005            # 편도 0.05%
  slippage_rate: 0.0005       # 편도 0.05%

tracks:
  initial_cash: 1000000       # 트랙별 가상 시작 자금 (원)
  enabled: [A]                # B는 3단계, C는 4단계에서 추가

day_boundary_utc_hour: 0      # 하루 기준 = UTC 00:00 = KST 09:00

risk:
  max_position_pct: 0.30      # 1회 진입 최대 비중 (= 최대 노출, 트랙당 포지션 1개)
  daily_loss_pct: 0.03        # 당일 시작 자산 대비 손실이 이 이상이면 당일 신규 진입 중단
  max_consecutive_losses: 5   # 연속 손실 횟수
  cooldown_hours: 24          # 연속 손실 시 신규 진입 중단 시간

strategy:
  name: ma_cross              # 1단계 임시 전략
  version: v1
  window_bars: 500            # 전략에 넘기는 최근 봉 수 (백테스트·실시간 동일하게 고정)
  params:
    fast: 20
    slow: 60
    atr_period: 14
    atr_stop_mult: 2.0

regime:                       # 국면 분류 (DESIGN.md 6-3). 백테스트 전에 고정, 결과를 본 뒤 바꾸지 않음
  ma_hours: 800               # 기준 이동평균 기간 (4시간봉 200개 = 800시간)
  slope_hours: 240            # 기울기 측정 구간 (10일). 80시간은 81%가 횡보로 분류돼 변경 (전략 성과 보기 전 결정)
  slope_threshold: 0.02       # 기울기 임계값 (±2%)

backtest:                     # 2단계 (DESIGN.md 6-3, 6-4)
  train_ratio: 0.7            # 앞 70% 학습, 뒤 30% 검증
  walk_forward:
    train_months: 18
    test_months: 6
  min_trades_train: 15        # 학습 구간에서 이보다 거래가 적은 파라미터는 선택하지 않음
  reject:                     # 탈락 기준
    val_sharpe_ratio_min: 0.5     # 검증 샤프 < 학습 샤프 × 0.5 → 성과 붕괴
    neighbor_profitable_min: 0.6  # 이웃 파라미터 중 수익 낸 비율 < 60% → 과최적화
    neighbor_sharpe_gap_max: 0.5  # 선택값 샤프 - 이웃 샤프 중앙값 > 0.5 → 과최적화
    min_trades_total: 30          # 전체 기간 거래 수 < 30 → 통계적 의미 부족
    cost_stress_mult: 2.0         # 수수료·슬리피지 2배에서도 수익인지 확인

comparison:                   # DESIGN.md 1-1
  months: 6
  min_signals: 30

council:                      # 3단계부터 사용 (DESIGN.md 8-6)
  default: { provider: claude, model: claude-sonnet-5-5 }
  roles: {}
  fallback: { enabled: false, provider: gemini, model: "" }
  timeout_sec: 60
  max_meetings_per_day: 6
