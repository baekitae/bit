# 모든 설정값은 여기서 관리합니다 (코드에 하드코딩 금지). DESIGN.md 4장·7장 참고.

market: KRW-BTC
timeframe_minutes: 240        # 4시간봉. 1시간봉은 60
db_path: data/bot.db          # 프로젝트 폴더 기준 상대 경로

data:
  history_years: 4            # 과거 데이터 수집 기간
  request_interval_sec: 0.12  # 업비트 API 호출 간격 (호출 제한 준수)
  max_candle_delay_bars: 1    # 실시간: 최신 마감 봉이 이보다 늦으면 데이터 이상

costs:
  fee_rate: 0.0005            # 편도 0.05%
  slippage_rate: 0.0005       # 편도 0.05%

tracks:
  initial_cash: 1000000       # 트랙별 가상 시작 자금 (원)
  # 실시간 모의매매에서 돌릴 트랙 (A 트랙을 먼저 처리한다)
  enabled: [A1, A2, A3, A4, A5, B1, B2, B3, B4, C, G1, G2, G3, G4]
  defs:
    # A: 규칙 전략 그대로 (파라미터는 2단계 4시간봉 리포트에서 고른 값)
    A1: {type: rule, strategy: donchian, timeframe: 240,
         params: {entry_period: 55, exit_period: 10, atr_period: 14, atr_stop_mult: 2.5}}
    A2: {type: rule, strategy: ma_cross, timeframe: 240,
         params: {fast: 30, slow: 100, atr_period: 14, atr_stop_mult: 3.0}}
    A3: {type: rule, strategy: rsi_reversion, timeframe: 240,
         params: {rsi_period: 14, oversold: 30, exit_level: 70, atr_period: 14, atr_stop_mult: 2.0}}
    A4: {type: rule, strategy: bollinger_reversion, timeframe: 240,
         params: {bb_period: 40, bb_std: 3.0, exit_std: 2.0, atr_period: 14, atr_stop_mult: 2.0}}
    A5: {type: rule, strategy: titan_rest, timeframe: 1440,     # 일봉 (사용자 설계 규칙 그대로)
         params: {ma_short: 5, ma_mid: 20, ma_long: 60, rise_bars: 5, rs_period: 60,
                  band_low: -0.02, band_high: 0.03, atr_period: 14, atr_stop_mult: 3.0, trail_pct: 0.12}}
    # B: 짝 A 트랙과 같은 전략 + AI 위원회 필터
    B1: {type: council, mirror: A1}
    B2: {type: council, mirror: A2}
    B3: {type: council, mirror: A3}
    B4: {type: council, mirror: A4}
    # G: B 와 똑같되 AI 만 Gemini (모델 비교용, DESIGN.md 8-6). 하루 한도는 councils.gemini 에서
    G1: {type: council, mirror: A1, council: gemini}
    G2: {type: council, mirror: A2, council: gemini}
    G3: {type: council, mirror: A3, council: gemini}
    G4: {type: council, mirror: A4, council: gemini}
    # C: A1 과 같은 전략 + AI 위원회 필터 + 전략 진화 (DESIGN.md 9장)
    C: {type: evolving, base: A1}

day_boundary_utc_hour: 0      # 하루 기준 = UTC 00:00 = KST 09:00

risk:
  max_position_pct: 0.30      # 1회 진입 최대 비중 (= 최대 노출, 트랙당 포지션 1개)
  daily_loss_pct: 0.03        # 당일 시작 자산 대비 손실이 이 이상이면 당일 신규 진입 중단
  max_consecutive_losses: 5   # 연속 손실 횟수
  cooldown_hours: 24          # 연속 손실 시 신규 진입 중단 시간

strategy:
  name: ma_cross              # 1단계 임시 전략
  version: v1
  window_bars: 600            # 전략에 넘기는 최근 봉 수 (4시간봉 600개 = 100일, 위원회 90일 수익률 계산 가능)
  params:
    fast: 20
    slow: 60
    atr_period: 14
    atr_stop_mult: 2.0

regime:                       # 국면 분류 (DESIGN.md 6-3). 백테스트 전에 고정, 결과를 본 뒤 바꾸지 않음
  ma_hours: 800               # 기준 이동평균 기간 (4시간봉 200개 = 800시간)
  slope_hours: 240            # 기울기 측정 구간 (10일). 80시간은 81%가 횡보로 분류돼 변경 (전략 성과 보기 전 결정)
  slope_threshold: 0.02       # 기울기 임계값 (±2%)

backtest:                     # 2단계 (DESIGN.md 6-3, 6-4)
  strategies: [ma_cross, donchian, rsi_reversion, bollinger_reversion]   # 기본 비교 대상
  fixed_params:               # --fixed 로 검증할 사용자 설계 규칙 (탐색 없이 그대로)
    titan_rest: {ma_short: 5, ma_mid: 20, ma_long: 60, rise_bars: 5, rs_period: 60,
                 band_low: -0.02, band_high: 0.03, atr_period: 14, atr_stop_mult: 3.0, trail_pct: 0.12}
  train_ratio: 0.7            # 앞 70% 학습, 뒤 30% 검증
  walk_forward:
    train_months: 18
    test_months: 6
  min_trades_train: 15        # 학습 구간에서 이보다 거래가 적은 파라미터는 선택하지 않음
  reject:                     # 탈락 기준
    val_sharpe_ratio_min: 0.5     # 검증 샤프 < 학습 샤프 × 0.5 → 성과 붕괴
    neighbor_profitable_min: 0.6  # 이웃 파라미터 중 수익 낸 비율 < 60% → 과최적화
    neighbor_sharpe_gap_max: 0.5  # 선택값 샤프 - 이웃 샤프 중앙값 > 0.5 → 과최적화
    min_trades_total: 30          # 전체 기간 거래 수 < 30 → 통계적 의미 부족
    cost_stress_mult: 2.0         # 수수료·슬리피지 2배에서도 수익인지 확인

comparison:                   # DESIGN.md 1-1
  months: 6
  min_signals: 30

council:                      # AI 위원회 (DESIGN.md 8장)
  default: {provider: claude, model: claude-opus-5-5, effort: high}
  roles: {}                   # 역할별 다르게 쓰려면 예) red_team: {model: claude-sonnet-5-5}
                              # 역할 이름: trend, regime, red_team, chair, evolution(C 트랙 수정안)
  fallback: {enabled: false, provider: gemini, model: ""}   # 기본 제공자 오류 시 예비 (기본 꺼짐)
  timeout_sec: 300            # 위원 1명 응답 대기 한도 (초과 시 skip)
  max_tokens: 16000
  max_meetings_per_day: 8     # 하루 최대 소집 횟수 (B 트랙 전체 합계, 초과 시 skip)
  usd_krw: 1400               # 비용 원화 환산
  pricing:                    # 백만 토큰당 달러 [입력, 출력] (2026-10 기준, 바뀌면 수정)
    claude-opus-5-5: [4.0, 20.0]
    claude-sonnet-5-5: [2.0, 10.0]
    claude-haiku-5-5: [0.10, 0.50]
    claude-opus-4-8: [5.0, 25.0]

councils:                     # 추가 위원회 (트랙 정의에서 council: <이름> 으로 고름)
  gemini:                     # G 트랙용 비교 위원회. 키: .env 의 GEMINI_API_KEY
    default: {provider: gemini, model: gemini-2.5-flash, effort: high}   # 모델 이름은 AI Studio 에서 확인 후 수정
    roles: {}
    fallback: {enabled: false}
    timeout_sec: 120
    max_tokens: 8000
    max_meetings_per_day: 5   # 회의 1회 = 호출 4회. 무료 한도(예: 하루 20회)를 넘지 않게
    free: true                # 무료 등급: 비용 0원으로 기록
    usd_krw: 1400
    pricing: {}

evolution:                    # C 트랙 진화 루프 (DESIGN.md 9장)
  fixed_days: 14              # 현재 버전 고정 운영 기간
  exclude_recent_days: 14     # 수정안 검증에서 제외할 최근 기간
  min_sharpe_gain: 0.2        # 워크포워드 표본 외 샤프가 현재보다 이만큼 높아야 통과
  min_trades_ratio: 0.7       # 표본 외 거래 수가 현재의 70% 이상이어야 통과
  shadow_days: 14             # 섀도 운영 기본 기간
  max_shadow_days: 42         # 신호가 모자랄 때 최대 연장 기간
  min_shadow_signals: 4       # 섀도 기간 두 버전 진입 신호 합계 최소

notify:                       # 텔레그램 알림 (키는 .env). 보낼 항목
  trades: true                # 진입·청산 체결
  meetings: true              # 위원회 결정 (B·G·C)
  errors: true                # 데이터·처리 오류, C 트랙 진화 단계
  daily_summary: true         # 매일 KST 09시 트랙별 자산 요약

live:                         # 실시간 루프 (DESIGN.md 12장)
  delay_after_close_sec: 15   # 봉 마감 후 이만큼 기다렸다가 처리
  max_late_sec: 900           # 마감 후 이보다 늦게 처리하게 된 봉은 매매하지 않음 (소급 매매 금지)
